<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c0b" />
    <meta name="description" content="Concord: texto, voz e tela compartilhada sem peso desnecessario." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Concord // Alpha 01</title>
    <script>
      (() => {
        const key = 'concord.theme.v1'
        let colorMode = 'system'
        let stored = {}
        try {
          stored = JSON.parse(localStorage.getItem(key) || '{}')
          if (['system', 'light', 'dark'].includes(stored.colorMode)) colorMode = stored.colorMode
        } catch { /* usa o dispositivo */ }
        const resolved = colorMode === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : colorMode
        document.documentElement.dataset.styleTheme = ['concord', 'ios', 'brutal'].includes(stored.styleTheme) ? stored.styleTheme : 'concord'
        document.documentElement.dataset.colorMode = resolved
        document.documentElement.style.colorScheme = resolved
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
